# /init command bundle: mounts the host half; the client half (lib/client.js)
# is discovered through the package.json dsh.client declaration and provides
# the "/" menu row (icon + localized label) plus its action.
# The staged prompt rides the one-shot "init:task" system-prompt section
# (order 550), never as a conversation bubble. Override config.prompt with
# custom full text ({{cwd}} placeholder) to replace the built-in instructions.
- insert:
    - id: init-command
      name: '@local/init-command'
